name: build
on: [push, pull_request]
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx pxt target microbit
      - run: npx pxt install
      - run: npx pxt build
      - run: npm test
      - run: npm run check:locales
